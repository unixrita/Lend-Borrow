    <script>
        var account = window.localStorage.getItem("account");    
        var ref = db.collection('user'); 
        ref.get().then(querySnapshot => {
              querySnapshot.forEach(doc => { 
                if(doc.id == account){
                   window.localStorage.setItem("nickname", doc.data().nickname); 
                   window.localStorage.setItem("phone", doc.data().phonenumber); 
                }
                }); 
            });  
       //****************************************************上傳圖片start*****************************************************
        var files = [];
        document.getElementById("img_file").addEventListener("change", function(e) {
          files = e.target.files;
          for (let i = 0; i < files.length; i++) {
            console.log(files[i]);
          }
        });

        document.getElementById("send").addEventListener("click", function() {
          //checks if files are selected
          if (files.length != 0) {
            //Loops through all the selected files
            for (let i = 0; i < files.length; i++) {
              //create a storage reference
              var storage = firebase.storage().ref(files[i].name);

              //upload file
              var upload = storage.put(files[i]);

              //update progress bar
              upload.on(
                "state_changed",
                function progress(snapshot) {
                  var percentage =
                    (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                  document.getElementById("progress").setAttribute("style", "width:"+percentage+"%");
                },

                function error() {
                  alert("error uploading file");
                },

                function complete() {
                  getFileUrl(files[i].name);//呼叫function getFileUrl(filename)
                  document.getElementById(
                    "uploading"
                  ).innerHTML = `${files[i].name} 上傳成功！ `;
                }
              );
            }
          } else {
            alert("No file chosen");
          }
        });

        function getFileUrl(filename) {
          //create a storage reference
          var storage = firebase.storage().ref( filename);

          //拿到url
          storage
            .getDownloadURL()
            .then(function(url) {
              console.log(url);
              //alert("url"+url);
              window.localStorage.setItem("picture", url);//寫到window裡面
            })
            .catch(function(error) {
              console.log("error encountered");
            });
        }
        
 //****************************************************上傳圖片end*****************************************************  
         //****************************************************寫入資料庫start*************************************************
        function postdata() {
          
          var url = window.localStorage.getItem("picture");
          var name = document.getElementById('goods_name').value;
          var introduction = document.getElementById('introduction').value;
          var price = document.getElementById('price').value;
          var size = document.getElementById('size').value;
          var genders = document.querySelector('input[name="gender"]:checked').value;
          var categorys = document.querySelector('input[name="category"]:checked').value;
           db.collection('product').doc(genders).collection(categorys).doc().set({
                    picture: url,
                    belong: window.localStorage.getItem("nickname"),
                    name: name,
                    phone: window.localStorage.getItem("phone"),
                    introduction: introduction,
                    price: price,
                    size: size,
                    location: window.localStorage.getItem("location")

             }).then(() => console.log('Document successfully written!')).catch(error => console.error('Error writing document: ', error));
            alert("上傳成功!");
            setTimeout("location.href='goods.html'",500);

      }
        
//****************************************************寫入資料庫end*************************************************
         
    </script>
