    <script>

        var ref = db.collection('product').doc(gen).collection(cate); 
        ref.get().then(querySnapshot => {
            querySnapshot.forEach(doc => {
                if(doc.data().read == false){
                    db.collection("product").doc(gen).collection(cate).doc(doc.picture).update({
                        read: true
                    })
                    .then(() => console.log('Document successfully written!'))
                    .catch(error => console.error('Error writing document: ', error))
                }
            });
        });

      <script>
        var arr = [];
        var db = firebase.firestore();

        var ref = db.collection('product').doc(gen).collection(cate);
        ref.get().then(querySnapshot => {
            querySnapshot.forEach(doc => {
                arr.push(doc.id);
            });
            query_product();
        });
        
        function query_product(){
            for(var i=0; i<arr.length; i++){
                var tag = arr[i];
                product(tag)
            }
        }
         
         
        function product(tag){
            var ref = db.collection("product");
                ref.get().then(querySnapshot => {
                    querySnapshot.forEach(doc => {
                        if(doc.id == tag){
                            var id = doc.id;
                            var picture = doc.data().picture;
                            
                        }
                    });
                });
        }       
            
            var ref2 = db.collection("product").doc(gen).collection(cate).doc(type);
            ref2.onSnapshot(doc => { 
                var picture = doc.data().picture;
                var name = doc.data().name;
                var price = doc.data().price;
                var introduction = doc.data().introduction;
                
                var belong = doc.data().belong;
                lender = belong;
                
                var size = doc.data().size;
                document.getElementById('goods').src = picture; 
                document.getElementById('name').append(name);
                document.getElementById('price').append(price);
                document.getElementById('introduction').append(introduction);
                 
                document.getElementById('belong').append(belong); 
                window.localStorage.setItem("belong", belong);
                document.getElementById('name').append(size);
            });
          
          var lender = window.localStorage.getItem('belong');
          var ref3 = db.collection("user").doc(lender);
          
            ref3.onSnapshot(doc => { 
                var picture2 = doc.data().picture;
                var nickname = doc.data().nickname;
                var phonenumber = doc.data().phonenumber;
                var address = doc.data().address;
                document.getElementById('lender').src = picture2; 
                document.getElementById('nickname1').append(nickname);
                document.getElementById('phone').append(phonenumber);
               
            });
          
             
        
      </script>
