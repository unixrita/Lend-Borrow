    <script>

      var firebaseConfig = {

      };
      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      firebase.analytics();
      var db = firebase.firestore();
        
      var account = window.sessionStorage.getItem("account");
      
      if(window.localStorage.getItem("gender") != null){
          var gen = window.localStorage.getItem("gender");
          var cate = window.localStorage.getItem("category");
          var cgen = window.localStorage.getItem("cgender");
          var ccate = window.localStorage.getItem("ccategory");
          document.getElementById("gender1").textContent= cgen; 
          document.getElementById("category1").textContent= ccate; 
      }else{
          window.localStorage.setItem("gender", "female");
          window.localStorage.setItem("cgender", "女裝");
          window.localStorage.setItem("category", "short");
          window.localStorage.setItem("ccategory", "上衣");
          document.getElementById("gender1").textContent= "女裝"; 
          document.getElementById("category1").textContent= "上衣";      
      }
        
      var gender = window.localStorage.getItem("gender");
      var category = window.localStorage.getItem("category");
      
      
      if(window.localStorage.getItem("search_text") != null){
          var search_text = window.localStorage.getItem("search_text");
          document.getElementById("search__input").setAttribute("value", search_text);
      }
        
      var ref = db.collection('product').doc(gender).collection(category);    
      ref.get().then(querySnapshot => {
          querySnapshot.forEach(doc => { 
            window.localStorage.setItem("each_id", doc.id);
            var doc_name = window.localStorage.getItem("each_id");
              
            if(window.localStorage.getItem("search_text")!=null){ //沒有符合字串就跳過
                
                var n = doc.data().name.search(window.localStorage.getItem("search_text"));
                if(n == -1){
                    return;
                }else{}
            }
              
              
            var picture = doc.data().picture;
            var price = doc.data().price;
            var t = document.createElement("div");
            var t1 = document.createElement("div");
            var t11 = document.createElement("a"); 
            var t111 = document.createElement("img"); 
            var t112 = document.createElement("div"); 
            var t1121 = document.createElement("div");
            var t11211 = document.createElement("p");
            var t11212 = document.createElement("p"); 
            var t1122 = document.createElement("div");
            var t11221 = document.createElement("div");
            var t112211 = document.createElement("p");
            var t12 = document.createElement("a");
            var t121 = document.createElement("img");
              
            t.setAttribute("class", "col-md-3");
              
            t1.setAttribute("class", "card");
            t1.classList.add("mb-4");
            t1.classList.add("shadow-sm");
              
            t11.setAttribute("href", "goods-introduction.html");
            t11.onclick = function (){catch_id(doc.id);};
            
            t111.setAttribute("src", picture);
            t111.setAttribute("width", "100%");
              
            t112.setAttribute("class", "card-body");
              
            t1121.setAttribute("class", "row");
            t1121.style.marginLeft = "0px";
              
            t11211.setAttribute("class", "card-text")
            t11211.style.marginRight = "10px";
            t11211.textContent = doc.data().name;
              
            t11212.setAttribute("class", "card-text")
            t11212.textAlign = "right";
            t11212.textContent = doc.data().size;
            
            t1122.setAttribute("class", "d-flex");
            t1122.classList.add("justify-content-between");
            t1122.classList.add("align-items-center");
              
            t11221.setAttribute("class", "btn-group");
              
            t112211.textContent = doc.data().price;
              
            t12.setAttribute("href", "#");
            t12.onclick = function() { heart(doc.id); };
              
            t121.setAttribute("src", "img/heart_white.png");
            t121.setAttribute("width", "10%");
            t121.setAttribute("style", "float: right; margin-right:20px; margin-top: -35px");
            t121.setAttribute("id", doc_name);
              
            t11221.append("NT$", t112211);
            t1122.append(t11221);
            t1121.append(t11211, t11212)
            t112.append(t1121, t1122);
            t11.append(t111, t112);
            t12.append(t121);
            t1.append(t11, t12);
            t.append(t1);
              
            document.getElementById("product").append(t);
            
            var ref = db.collection('product').doc(gender).collection(category).doc(doc_name).collection('heart');
            
            ref.get().then(querySnapshot => {
              querySnapshot.forEach(doc => {  
              var hearter = doc.data().hearter;
              if(hearter == account){
                document.getElementById(doc_name).src = "img/heart.png";
              }
            });
           });
          }); 
        });
         
    </script>
    <script>
      function setgender(gen, cgen){
          window.localStorage.setItem("gender", gen);
          window.localStorage.setItem("cgender", cgen);
          window.location.reload();
      } 
      function setcategory(cate, ccate){
          window.localStorage.setItem("category", cate);
          window.localStorage.setItem("ccategory", ccate);
          window.location.reload();
      }
      function catch_id(id){
          window.localStorage.setItem("doc_name", id);
          window.location.href = "goods-introduction.php"
      }
      function heart(id){
          var check = document.getElementById(id).getAttribute("src");
          if(check == "img/heart_white.png"){ //按愛心
              db.collection('product').doc(gender).collection(category).doc(id).collection('heart').doc().set({
                 hearter: account,
              })
                
          }
          else if(check == "img/heart.png"){ //收回愛心
              var ref = db.collection('product').doc(gender).collection(category).doc(id).collection('heart');
              var doc_name_heart = "";
              ref.get().then(querySnapshot => { //取得愛心的文件名稱
                querySnapshot.forEach(doc => {
                    if(doc.data().hearter == account){
                        doc_name_heart = doc._E.path.segments[10];
                    }
                    
                });
                var ref = db.collection('product').doc(gender).collection(category).doc(id).collection('heart').doc(doc_name_heart);

                ref.delete().then(function() {
                    console.log('Document successfully deleted!');
                }).catch(function(error) {
                    console.error('Error removing document: ', error)
                })
             });
          }
          setTimeout("window.history.go(0)",500); //過0.5秒後重新載入頁面
      }
      function search(){//查詢關鍵字
        var search_prom = document.getElementById("search__input").value;
        window.localStorage.setItem("search_text", search_prom);
        window.location.reload();
      }
    </script>
