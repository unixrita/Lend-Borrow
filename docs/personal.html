    //**************************讀照片START**************************
        var files = [];
            document.getElementById("visa").addEventListener("change", function(e) {
              files = e.target.files;
              for (let i = 0; i < files.length; i++) {
                console.log(files[i]);
              }
            });

            document.getElementById("send").addEventListener("click", function() {
              var account = '123@gmail.com';

              //checks if files are selected
              if (files.length != 0) {
                //Loops through all the selected files
                for (let i = 0; i < files.length; i++) {
                  //create a storage reference
                  var storage = firebase.storage().ref(account+'/'+files[i].name);

                  //upload file
                  var upload = storage.put(files[i]);

                  //update progress bar
                  upload.on(
                    "state_changed",
                    function progress(snapshot) {
                      var percentage =
                        (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        document.getElementById("progress").setAttribute("style", "width:"+percentage+"%");
                    },

                    function error() {
                      alert("error uploading file");
                    },

                    function complete() {
                      getFileUrl(files[i].name);//呼叫function getFileUrl(filename)
                      document.getElementById("Visa").innerHTML = `${files[i].name} 更改成功！ `;
                    }
                  );
                }
              } 
            });

            function getFileUrl(filename) {
              //create a storage reference
              var account = '123@gmail.com';
              var storage = firebase.storage().ref(account+'/'+filename);

              //拿到url
              storage
                .getDownloadURL()
                .then(function(url) {
                  console.log(url);
                  window.localStorage.setItem("visa", url);//寫到window裡面
                  upload_visa();
                })
                .catch(function(error) {
                });
            }
        //**************************讀照片END**************************
           function upload_visa(){
                var visa = window.localStorage.getItem("visa");
                var account = '123@gmail.com';

                db.collection("user").doc(account).update({
                    picture: visa
                }),{ merge: true }

                .then(() => console.log('Document successfully written!')) //讓他開始執行
                .catch(error => console.error('Error writing document: ', error))

                window.localStorage.removeItem("visa");
            }
