    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <title>Document</title>
    
    <script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-analytics.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.2/firebase-firestore.js"></script>
    <!--    頁面自動5秒跳轉-->
    <meta http-equiv="refresh" content="5;url=login.html"> 
    <style>
        a:link,
        a:visited {
            color:#FFFFFF;
            text-decoration:none;
            }
        a:hover,
        a:active {
            color:#000000;
            text-decoration:none;
            }
        p {font-family: 微軟正黑體}
        font {font-family: 微軟正黑體}
    </style>
<html>
<body>
    <img src="img/login_backgroud.png" height="100%" width="100%" alt="">
    <button type="button" data-toggle="modal" data-target="#wait" id="boom" hidden></button>
    
    <div class="modal fade" id="wait">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body">
               <label class="control-label">
                   <font>請稍後，正在為您進行註冊~~ </font>
               </label>
               <div class="progress">
                  <div id="progress" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%"></div>
                </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/jquery-3.2.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <!-- The javascript plugin to display page loading on top-->
    <script src="js/plugins/pace.min.js"></script>
    <!-- Page specific javascripts-->
    <script type="text/javascript" src="js/plugins/bootstrap-notify.min.js"></script>
    <script type="text/javascript" src="js/plugins/sweetalert.min.js"></script>
</body>

<script>
    //預設滑鼠點擊了按鈕
    var e = document.createEvent("MouseEvents");
	e.initEvent("click", true, true);
	document.getElementById("boom").dispatchEvent(e);
    //進度條的時間調整
    window.setTimeout("document.getElementById('progress').setAttribute('style', 'width:10%')",500);
    window.setTimeout("document.getElementById('progress').setAttribute('style', 'width:20%')",1000);
    window.setTimeout("document.getElementById('progress').setAttribute('style', 'width:30%')",1500);
    window.setTimeout("document.getElementById('progress').setAttribute('style', 'width:40%')",2000);
    window.setTimeout("document.getElementById('progress').setAttribute('style', 'width:50%')",2500);
    window.setTimeout("document.getElementById('progress').setAttribute('style', 'width:60%')",3000);
    window.setTimeout("document.getElementById('progress').setAttribute('style', 'width:80%')",3500);
    window.setTimeout("document.getElementById('progress').setAttribute('style', 'width:90%')",4000);
    window.setTimeout("document.getElementById('progress').setAttribute('style', 'width:100%')",4500);
</script>

      };
    
    // 初始化Firebase
    firebase.initializeApp(firebaseConfig);
    firebase.analytics();
    
    var db = firebase.firestore();  
    
    var nickname = window.localStorage.getItem("nickname");
    var account = window.localStorage.getItem("account");
    var password = window.localStorage.getItem("password");
   
    
    localStorage.clear();
    
    db.collection('user').doc(account).set({
      nickname: nickname,
      password: password,
      account: account,
	  picture:" https://firebasestorage.googleapis.com/v0/b/hackathon-7e6e5.appspot.com/o/people_0.png?alt=media&token=341c97a1-2bfb-4ab8-bd99-c7263f0040d0"
